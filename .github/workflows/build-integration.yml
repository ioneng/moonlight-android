name: Build Noir + Moonlight 12.2 Integration

on:
  push:
    branches:
      - integration/noir-official-12.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Upload non-root APKs
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-12.2-integration-debug-APKs
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
          if-no-files-found: error

# trigger integration build
